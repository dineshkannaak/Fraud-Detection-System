name: Fraud Detection CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Compile Python files
        run: python -m compileall -q app.py train.py streamlit_app.py monitor.py load_test.py scripts tests

      - name: Lint
        run: flake8 app.py train.py streamlit_app.py monitor.py load_test.py scripts tests --max-line-length=120 --ignore=E501,W503,E402

      - name: Run unit and API tests
        run: pytest tests/ -v --tb=short

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile -t fraud-api:${{ github.sha }} .

      - name: Build Streamlit image
        run: docker build -f Dockerfile.streamlit -t fraud-streamlit:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag fraud-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fraud-api:latest
          docker tag fraud-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fraud-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/fraud-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/fraud-api:${{ github.sha }}

      - name: Push Streamlit image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag fraud-streamlit:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fraud-streamlit:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/fraud-streamlit:latest
